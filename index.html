<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<title>مِداد</title>
<meta name="theme-color" content="#14161c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="مداد">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&family=Cairo:wght@400;700;900&family=Amiri:wght@400;700&family=Reem+Kufi:wght@400;700&family=Lateef:wght@400;700&family=Aref+Ruqaa:wght@400;700&family=Changa:wght@400;700&family=Almarai:wght@400;700;800&family=El+Messiri:wght@400;700&family=Lemonada:wght@400;700&family=Markazi+Text:wght@400;700&family=Scheherazade+New:wght@400;700&family=Noto+Naskh+Arabic:wght@400;700&family=Noto+Kufi+Arabic:wght@400;700;900&family=Harmattan:wght@400;700&family=Mada:wght@400;700;900&family=Rakkas&family=Katibeh&family=Jomhuria&family=Lalezar&family=Mirza:wght@400;700&family=Vibes&family=Gulzar&family=Readex+Pro:wght@400;700&family=IBM+Plex+Sans+Arabic:wght@400;700&family=Baloo+Bhaijaan+2:wght@400;700;800&family=Marhey:wght@400;700&family=Ruwudu:wght@400;700&family=Qahiri&family=Blaka&family=Kufam:wght@400;700&family=Amiri+Quran&family=Alkalami&display=swap">
</head>
<body>
<style>
:root{
  --bg:#f3f2ec; --panel:#ffffff; --panel2:#e9e8e0; --line:#d6d4ca; --text:#1b1d24; --muted:#6b6e79;
  --accent:#1f9e8c; --accent-ink:#ffffff; --danger:#c8453b; --canvas-bg:#dedcd2; --shadow:0 10px 30px rgba(20,22,28,.18);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#14161c; --panel:#1d2029; --panel2:#262a35; --line:#2f3441; --text:#ecebe6; --muted:#9a9eab;
    --accent:#2fb8a6; --accent-ink:#0d1a18; --danger:#e5645a; --canvas-bg:#0f1116; --shadow:0 10px 30px rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"]{
  --bg:#14161c; --panel:#1d2029; --panel2:#262a35; --line:#2f3441; --text:#ecebe6; --muted:#9a9eab;
  --accent:#2fb8a6; --accent-ink:#0d1a18; --danger:#e5645a; --canvas-bg:#0f1116; --shadow:0 10px 30px rgba(0,0,0,.5);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overscroll-behavior:none;overflow:hidden;max-width:100vw;-webkit-text-size-adjust:100%;touch-action:manipulation}
body{background:var(--bg);color:var(--text);font-family:"Tajawal",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:15px;direction:rtl;
  display:flex;flex-direction:column;height:100dvh;width:100vw;position:fixed;inset:0;overflow:hidden;user-select:none;-webkit-user-select:none}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{background:none;border:0;cursor:pointer;padding:0}
button:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
svg{display:block}

/* top bar */
.topbar{display:flex;align-items:center;gap:5px;padding:8px 8px;background:var(--panel);border-bottom:1px solid var(--line);flex:0 0 auto;
  padding-top:max(8px,env(safe-area-inset-top))}
.brand{font-family:"Reem Kufi","Tajawal",sans-serif;font-weight:700;font-size:20px;color:var(--accent);letter-spacing:.5px;margin-inline-end:4px}
.topbar .grow{flex:1;min-width:0}
.title-in{background:transparent;border:0;width:100%;text-align:start;color:var(--muted);font-size:13px;padding:4px 2px}
.title-in:focus{color:var(--text);outline:0;border-bottom:1px solid var(--accent)}
.ib{width:36px;height:36px;flex:0 0 auto;border-radius:10px;display:grid;place-items:center;color:var(--text);background:var(--panel2)}
.ib:disabled{opacity:.35;cursor:default}
.ib[hidden],.btn[hidden]{display:none}
.ib.primary{background:var(--accent);color:var(--accent-ink);width:auto;padding:0 12px;font-weight:700;gap:6px;display:flex}
.ib.danger{color:var(--danger)}

/* canvas stage */
.stage{flex:1;min-height:0;position:relative;touch-action:none;background:var(--canvas-bg);display:grid;place-items:center;overflow:hidden;padding:14px}
.stage .wrap{box-shadow:var(--shadow);position:relative}
.stage .hint{position:absolute;inset:auto 0 10px;text-align:center;color:var(--muted);font-size:12px;pointer-events:none}
.zoomlbl{position:absolute;top:8px;inset-inline-start:10px;font-size:11px;color:var(--muted);background:var(--panel);padding:2px 8px;border-radius:20px;border:1px solid var(--line)}

/* selection quick bar */
.quick{position:absolute;top:8px;inset-inline-end:10px;display:flex;gap:4px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:4px}
.quick[hidden]{display:none}
.quick button{width:34px;height:34px;border-radius:8px;display:grid;place-items:center}
.quick button:active{background:var(--panel2)}

/* bottom sheet + tabs */
.sheet{flex:0 0 auto;background:var(--panel);border-top:1px solid var(--line);max-height:46dvh;display:flex;flex-direction:column;transition:max-height .2s}
.sheet.collapsed .panel{display:none}
.grip{height:18px;display:grid;place-items:center;flex:0 0 auto}
.grip i{width:44px;height:4px;border-radius:2px;background:var(--line)}
.panel{overflow-y:auto;overflow-x:hidden;padding:10px 12px 12px;min-height:0;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.tabs{display:flex;overflow-x:auto;border-top:1px solid var(--line);scrollbar-width:none;padding-bottom:env(safe-area-inset-bottom);flex:0 0 auto}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:1 0 50px;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 4px 6px;font-size:10.5px;color:var(--muted);border-top:2px solid transparent}
.tab.active{color:var(--accent);border-top-color:var(--accent)}
.tab svg{width:22px;height:22px}

/* generic controls */
.sec{margin-bottom:12px}
.sec-h{font-size:12px;color:var(--muted);margin:0 0 6px;letter-spacing:.3px;display:flex;justify-content:space-between;align-items:center}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;padding:8px 12px;border-radius:10px;background:var(--panel2);border:1px solid transparent;font-size:13px;white-space:nowrap}
.chip.active{border-color:var(--accent);color:var(--accent)}
.btn{padding:10px 14px;border-radius:10px;background:var(--panel2);font-weight:500;display:inline-flex;align-items:center;gap:6px}
.btn.primary{background:var(--accent);color:var(--accent-ink);font-weight:700}
.btn.danger{color:var(--danger)}
.btn.block{width:100%;justify-content:center}
.grid{display:grid;gap:8px}
.g3{grid-template-columns:repeat(3,1fr)} .g4{grid-template-columns:repeat(4,1fr)} .g5{grid-template-columns:repeat(5,1fr)} .g6{grid-template-columns:repeat(6,1fr)}
.slider{display:grid;grid-template-columns:70px 1fr 40px;align-items:center;gap:8px;font-size:13px;margin-bottom:6px}
.slider span:last-child{text-align:center;color:var(--muted);font-variant-numeric:tabular-nums;font-size:12px}
input[type=range]{width:100%;accent-color:var(--accent);margin:0}
.sw{width:100%;aspect-ratio:1;border-radius:10px;border:2px solid var(--line);cursor:pointer}
.sw.active{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.sw.custom{display:grid;place-items:center;background:conic-gradient(red,yellow,lime,cyan,blue,magenta,red);position:relative;overflow:hidden}
.sw.custom input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}
.sw.none{background:linear-gradient(135deg,transparent 45%,var(--danger) 45%,var(--danger) 55%,transparent 55%),var(--panel2)}
textarea.txt{-webkit-user-select:text;user-select:text;width:100%;min-height:64px;border:1px solid var(--line);border-radius:10px;padding:8px;background:var(--panel2);resize:vertical;direction:rtl;text-align:right}
.fontlist{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}
.fontlist button{padding:10px 8px;border-radius:10px;background:var(--panel2);font-size:20px;line-height:1.3;text-align:center;border:1px solid transparent;overflow:hidden;white-space:nowrap}
.fontlist button.active{border-color:var(--accent)}
.fontlist small{display:block;font-family:"Tajawal";font-size:10px;color:var(--muted)}
.emoji{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.emoji button{font-size:26px;padding:6px;border-radius:8px;background:var(--panel2)}
.orn button{font-size:28px;font-family:"Amiri","Scheherazade New",serif}
.sizes button{padding:10px 8px;border-radius:10px;background:var(--panel2);text-align:center;border:1px solid transparent;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px}
.sizes button.active{border-color:var(--accent)}
.sizes .box{border:2px solid var(--muted);border-radius:3px;display:block}
.sizes small{color:var(--muted);font-size:10px;font-variant-numeric:tabular-nums}
.tpl{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tpl button{aspect-ratio:3/4;border-radius:10px;overflow:hidden;position:relative;display:grid;place-items:center;color:#fff;font-weight:700;font-size:15px;text-shadow:0 1px 4px rgba(0,0,0,.5);padding:6px;border:1px solid var(--line)}
.tpl button span{position:absolute;bottom:6px;font-size:10px;font-weight:400;opacity:.9}
.layers{display:flex;flex-direction:column;gap:6px}
.layer{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:10px;background:var(--panel2);border:1px solid transparent}
.layer.active{border-color:var(--accent)}
.layer .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px}
.layer button{width:30px;height:30px;border-radius:7px;display:grid;place-items:center;color:var(--muted)}
.layer button:active{background:var(--panel)}
.seg{display:flex;background:var(--panel2);border-radius:10px;padding:3px;gap:2px}
.seg button{flex:1;padding:7px;border-radius:8px;font-size:13px}
.seg button.active{background:var(--panel);color:var(--accent);font-weight:700}
.empty{color:var(--muted);font-size:13px;text-align:center;padding:14px}
.filters{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:4px}
.filters::-webkit-scrollbar{display:none}
.filters button{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;color:var(--muted)}
.filters button.active{color:var(--accent)}
.filters .th{width:56px;height:56px;border-radius:10px;background:linear-gradient(135deg,#f6c453,#e0533f 45%,#2d6cdf);border:2px solid transparent}
.filters button.active .th{border-color:var(--accent)}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.pj{background:var(--panel2);border-radius:12px;overflow:hidden;border:1px solid var(--line);display:flex;flex-direction:column}
.pj .th{aspect-ratio:1;background:var(--canvas-bg) center/contain no-repeat;cursor:pointer}
.pj .nm{font-size:13px;font-weight:700;padding:6px 8px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pj .dt{font-size:11px;color:var(--muted);padding:0 8px}
.pj .ac{display:flex;gap:4px;padding:6px 8px 8px}
.pj .ac button{flex:1;font-size:12px;padding:6px;border-radius:8px;background:var(--panel)}
.pj .ac button.danger{color:var(--danger)}
.toast{position:fixed;bottom:calc(46dvh + 10px);left:50%;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:8px 14px;border-radius:20px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:20;white-space:nowrap}
.toast.show{opacity:1}
/* modal */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:grid;place-items:center;z-index:30;padding:20px}
.modal[hidden]{display:none}
.modal .card{background:var(--panel);border-radius:16px;padding:16px;width:min(420px,100%);max-height:90dvh;overflow:auto}
.modal h3{margin:0 0 10px;font-size:17px}
input[type=number],select.sel{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:8px;width:100%}
@media (min-width:900px){
  body{flex-direction:row}
  .topbar{order:0;position:absolute;top:0;inset-inline:0;z-index:5}
  .stage{order:1;padding-top:70px}
  .sheet{order:2;width:380px;max-height:none;border-top:0;border-inline-start:1px solid var(--line);flex-direction:column-reverse;padding-top:60px}
  .sheet.collapsed .panel{display:block}
  .grip{display:none}
  .tabs{border-top:0;border-bottom:1px solid var(--line);flex-wrap:wrap}
  .tab{flex:1 0 20%}
  .toast{bottom:24px}
}
@media (max-width:420px){.ib{width:34px;height:34px}.ib svg{width:18px;height:18px}.ib.primary{padding:0 10px;font-size:13px}.brand{font-size:17px}.title-in{font-size:12px}}
.ib svg{width:19px;height:19px}.quick button svg{width:18px;height:18px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<style>
.gate{position:fixed;inset:0;z-index:50;background:var(--bg);display:grid;place-items:center;padding:20px;overflow:auto}
.gate[hidden]{display:none}
.gate .card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:22px;width:min(400px,100%);box-shadow:var(--shadow)}
.gate .logo{font-family:"Reem Kufi","Tajawal",sans-serif;font-size:38px;font-weight:700;color:var(--accent);text-align:center;margin:0}
.gate .sub{text-align:center;color:var(--muted);font-size:13px;margin:2px 0 18px}
.gate label{display:block;font-size:12px;color:var(--muted);margin:10px 0 4px}
.gate,.gate *{user-select:text;-webkit-user-select:text}
.gate input{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:11px 12px;font-size:16px;direction:ltr;text-align:left;unicode-bidi:plaintext;-webkit-appearance:none;appearance:none}
.gate input[name=name]{direction:rtl;text-align:right}
.gate .btn.block{margin-top:14px;padding:12px}
.gate .alt{text-align:center;font-size:13px;color:var(--muted);margin-top:12px}
.gate .alt button{color:var(--accent);font-weight:700}
.gate .msg{font-size:13px;margin-top:10px;padding:10px;border-radius:10px;background:var(--panel2)}
.gate .msg.err{color:var(--danger)}
.gate .msg.ok{color:var(--accent)}
.gate .state{text-align:center;padding:10px 0}
.gate .state .big{font-size:44px;margin-bottom:8px}
.gate .state h3{margin:0 0 6px;font-size:18px}
.gate .state p{color:var(--muted);font-size:13px;margin:0 0 14px;line-height:1.6}
.acct{display:flex;align-items:center;gap:8px}
</style>
<div class="gate" id="gate">
  <div class="card" id="gateCard"><p class="logo">مِداد</p><p class="sub">جارٍ التحقق…</p></div>
</div>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>
<script>
const FB_CONFIG={apiKey:"AIzaSyCR2y3z08oOiAC7oGATqEAa8pLVR9TBhOk",authDomain:"midad-1929d.firebaseapp.com",databaseURL:"https://midad-1929d-default-rtdb.europe-west1.firebasedatabase.app",projectId:"midad-1929d",storageBucket:"midad-1929d.firebasestorage.app",messagingSenderId:"516275935186",appId:"1:516275935186:web:7e232fffb2c16199205a0b"};
const ADMIN_EMAIL="a0545777031@gmail.com";
firebase.initializeApp(FB_CONFIG);
const auth=firebase.auth(),db=firebase.database();
auth.languageCode='ar';
const ERR={'auth/invalid-email':'البريد الإلكتروني غير صحيح','auth/user-not-found':'لا يوجد حساب بهذا البريد','auth/wrong-password':'كلمة المرور غير صحيحة','auth/invalid-credential':'البريد أو كلمة المرور غير صحيحة','auth/email-already-in-use':'هذا البريد مسجّل مسبقًا — سجّل الدخول','auth/weak-password':'كلمة المرور قصيرة (6 أحرف على الأقل)','auth/too-many-requests':'محاولات كثيرة، حاول لاحقًا','auth/network-request-failed':'تعذر الاتصال بالإنترنت'};
const errMsg=e=>ERR[e.code]||('حدث خطأ: '+(e.code||e.message));
const fmtDate=ms=>ms?new Date(ms).toLocaleDateString('ar-SA-u-nu-latn',{year:'numeric',month:'long',day:'numeric'}):'—';
function gateHTML(mode,msg){
  const isReg=mode==='register';
  return `<p class="logo">مِداد</p><p class="sub">${isReg?'أنشئ حسابك — يُفعَّل بعد موافقة المدير':'سجّل الدخول للمتابعة'}</p>
  <form id="gateForm">
    ${isReg?'<label>الاسم</label><input name="name" required autocomplete="name" placeholder="اسمك الكامل">':''}
    <label>البريد الإلكتروني</label><input name="email" type="email" dir="ltr" required autocomplete="email" autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="name@example.com" inputmode="email">
    <label>كلمة المرور</label><input name="password" type="password" dir="ltr" required minlength="6" autocomplete="${isReg?'new-password':'current-password'}" placeholder="••••••••">
    <button class="btn primary block" type="submit">${isReg?'إنشاء الحساب':'دخول'}</button>
    ${msg?`<div class="msg ${msg.cls}">${msg.text}</div>`:''}
  </form>
  <div class="alt">${isReg?'لديك حساب؟ <button data-mode="login">سجّل الدخول</button>':'ليس لديك حساب؟ <button data-mode="register">سجّل الآن</button> · <button data-mode="reset">نسيت كلمة المرور</button>'}</div>`;
}
function stateHTML(icon,title,text,extra=''){return `<p class="logo">مِداد</p><div class="state"><div class="big">${icon}</div><h3>${title}</h3><p>${text}</p>${extra}<button class="btn" id="signOut">تسجيل الخروج</button></div>`;}
let gateMode='login';
function renderGate(msg){const c=document.getElementById('gateCard');c.innerHTML=gateHTML(gateMode,msg);
  c.querySelector('#gateForm').onsubmit=async e=>{e.preventDefault();const f=e.target,email=f.email.value.trim(),pw=f.password.value;const b=f.querySelector('button[type=submit]');b.disabled=true;b.textContent='…';
    try{if(gateMode==='register'){const cred=await auth.createUserWithEmailAndPassword(email,pw);await cred.user.updateProfile({displayName:f.name.value.trim()});await db.ref('users/'+cred.user.uid).set({email:email.toLowerCase(),name:f.name.value.trim(),status:'pending',createdAt:firebase.database.ServerValue.TIMESTAMP});}
      else await auth.signInWithEmailAndPassword(email,pw);}
    catch(err){renderGate({cls:'err',text:errMsg(err)});}};
  c.querySelectorAll('[data-mode]').forEach(b=>b.onclick=async()=>{if(b.dataset.mode==='reset'){const em=c.querySelector('[name=email]').value.trim();if(!em)return renderGate({cls:'err',text:'اكتب بريدك أولًا ثم اضغط "نسيت كلمة المرور"'});try{await auth.sendPasswordResetEmail(em);renderGate({cls:'ok',text:'أرسلنا رابط إعادة التعيين إلى بريدك'});}catch(err){renderGate({cls:'err',text:errMsg(err)});}return;}gateMode=b.dataset.mode;renderGate();});}
function showState(html){const c=document.getElementById('gateCard');c.innerHTML=html;const so=c.querySelector('#signOut');if(so)so.onclick=()=>auth.signOut();}
window.isAdminUser=u=>!!u&&(u.email||'').toLowerCase()===ADMIN_EMAIL;
let userRef=null;
auth.onAuthStateChanged(async u=>{
  const gate=document.getElementById('gate');if(userRef){userRef.off();userRef=null;}
  if(!u){gate.hidden=false;renderGate();document.dispatchEvent(new CustomEvent('midad-auth',{detail:null}));return;}
  let admin=window.isAdminUser(u);
  if(!admin){try{admin=(await db.ref('admins/'+u.uid).get()).val()===true;}catch(e){}}
  if(admin){gate.hidden=true;document.dispatchEvent(new CustomEvent('midad-auth',{detail:{user:u,admin:true}}));return;}
  userRef=db.ref('users/'+u.uid);
  userRef.on('value',async s=>{
    let d=s.val();
    if(!d){try{await userRef.set({email:(u.email||'').toLowerCase(),name:u.displayName||'',status:'pending',createdAt:firebase.database.ServerValue.TIMESTAMP});}catch(e){showState('⚠️','تعذر إنشاء ملفك',e.message);}return;}
    const now=Date.now();
    if(d.status==='approved'&&(!d.expiresAt||d.expiresAt>now)){gate.hidden=true;document.dispatchEvent(new CustomEvent('midad-auth',{detail:{user:u,admin:false,profile:d}}));return;}
    gate.hidden=false;document.dispatchEvent(new CustomEvent('midad-auth',{detail:null}));
    if(d.status==='blocked')showState(stateHTML('⛔','الحساب موقوف','تم إيقاف حسابك من قِبل المدير. تواصل معه لمزيد من التفاصيل.'));
    else if(d.status==='approved')showState(stateHTML('⏳','انتهى الاشتراك',`انتهى اشتراكك بتاريخ ${fmtDate(d.expiresAt)}. تواصل مع المدير لتجديده.`));

<script>
/* =========================== core =========================== */
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const PROPS=['name','role','ph','locked','selectable','hasControls','lockMovementX','lockMovementY','lockRotation','lockScalingX','lockScalingY','direction','preset','adj','splitByGrapheme','editable'];
let W=1080,H=1080,sizeId='ig',scale=1,tab='tpl',hist=[],hi=-1,restoring=false,fmt='png',qual=1,curId=null,dirty=false;
const fontReady={};
fabric.Object.prototype.set({transparentCorners:false,cornerColor:'#2fb8a6',cornerStrokeColor:'#ffffff',borderColor:'#2fb8a6',cornerSize:16,touchCornerSize:28,cornerStyle:'circle',padding:6,borderScaleFactor:1.5});
fabric.Object.prototype.controls.mtr.offsetY=-34;
fabric.textureSize=4096;
const canvas=new fabric.Canvas('c',{preserveObjectStacking:true,backgroundColor:'#ffffff',selection:true,allowTouchScrolling:false});

function ensureFont(f){
  if(fontReady[f])return fontReady[f];
  fontReady[f]=Promise.all([document.fonts.load(`16px "${f}"`),document.fonts.load(`700 16px "${f}"`)]).then(()=>{fabric.util.clearFabricFontCache(f);}).catch(()=>{});
  return fontReady[f];
}
function refreshTexts(){canvas.getObjects().filter(o=>o.type==='textbox'||o.type==='i-text'||o.type==='text').forEach(o=>ensureFont(o.fontFamily).then(()=>{o.initDimensions();o.setCoords();canvas.requestRenderAll();}));}
function fit(){
  const st=$('#stage');const cw=st.clientWidth-28,ch=st.clientHeight-28;
  scale=Math.max(.02,Math.min(cw/W,ch/H,1.5));
  canvas.setDimensions({width:Math.round(W*scale),height:Math.round(H*scale)});canvas.setZoom(scale);
  $('#zoomLbl').textContent=Math.round(scale*100)+'%';canvas.calcOffset();canvas.requestRenderAll();
}
new ResizeObserver(()=>fit()).observe($('#stage'));
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),1800);}
const debounce=(f,ms)=>{let t;return(...a)=>{clearTimeout(t);t=setTimeout(()=>f(...a),ms);};};

/* history */
function serialize(){return JSON.stringify(canvas.toJSON(PROPS));}
function snap(){if(restoring)return;const j=serialize();if(hist[hi]===j)return;hist=hist.slice(0,hi+1);hist.push(j);if(hist.length>25)hist.shift();hi=hist.length-1;updUndo();autosave();}
const snapSoon=debounce(snap,400);
function restore(i){restoring=true;canvas.loadFromJSON(hist[i],()=>{restoring=false;hi=i;refreshTexts();canvas.requestRenderAll();updUndo();renderPanel();updQuick();});}
function updUndo(){$('#undoBtn').disabled=hi<=0;$('#redoBtn').disabled=hi>=hist.length-1;}
$('#undoBtn').onclick=()=>{if(hi>0)restore(hi-1);};
$('#redoBtn').onclick=()=>{if(hi<hist.length-1)restore(hi+1);};
function autosave(){dirty=true;if(curId)cloudSaveSoon();}
$('#projTitle').addEventListener('change',autosave);

canvas.on('object:modified',snap);canvas.on('object:added',()=>{if(!restoring)snapSoon();});canvas.on('object:removed',()=>{if(!restoring)snapSoon();});
canvas.on('text:changed',e=>{if(e.target)e.target.ph=false;snapSoon();syncTextarea();});
canvas.on('text:editing:entered',e=>{const t=e.target;if(t&&t.ph){t.selectAll();}});
canvas.on('selection:created',onSel);canvas.on('selection:updated',onSel);canvas.on('selection:cleared',()=>{updQuick();renderPanel();});
function onSel(){const o=canvas.getActiveObject();updQuick();if(o){if(isText(o)&&tab!=='text')tab='text';else if(o.type==='image'&&tab!=='img'&&tab!=='fx')tab='img';else if(o.role==='overlay')tab='fx';}renderTabs();renderPanel();}
const isText=o=>o&&(o.type==='textbox'||o.type==='i-text'||o.type==='text');
function active(){return canvas.getActiveObject();}

/* quick bar */
function updQuick(){const o=active();$('#quick').hidden=!o;if(o){$('#qLock').style.color=o.locked?'var(--accent)':'';}}
$('#qDel').onclick=()=>{const o=active();if(!o)return;if(o.type==='activeSelection'){o.getObjects().forEach(x=>canvas.remove(x));canvas.discardActiveObject();}else canvas.remove(o);canvas.requestRenderAll();snap();};
$('#qDup').onclick=()=>{const o=active();if(!o)return;o.clone(c=>{c.set({left:o.left+40,top:o.top+40});canvas.add(c);canvas.setActiveObject(c);canvas.requestRenderAll();snap();},PROPS);};
$('#qUp').onclick=()=>{const o=active();if(o){canvas.bringForward(o);canvas.requestRenderAll();snap();}};
$('#qDown').onclick=()=>{const o=active();if(o){canvas.sendBackwards(o);canvas.requestRenderAll();snap();}};
$('#qLock').onclick=()=>{const o=active();if(!o)return;setLock(o,!o.locked);canvas.requestRenderAll();updQuick();snap();toast(o.locked?'تم قفل العنصر':'تم فك القفل');};
function setLock(o,v){o.set({locked:v,lockMovementX:v,lockMovementY:v,lockRotation:v,lockScalingX:v,lockScalingY:v,hasControls:!v,editable:isText(o)?!v:undefined});}

/* =========================== builders =========================== */
function gradient(colors,dir='v'){const c=colors.map((col,i)=>({offset:i/(colors.length-1),color:col}));
  return new fabric.Gradient({type:'linear',gradientUnits:'pixels',coords:dir==='v'?{x1:0,y1:0,x2:0,y2:H}:dir==='d'?{x1:0,y1:0,x2:W,y2:H}:{x1:0,y1:0,x2:W,y2:0},colorStops:c});}
function setBgColor(v){canvas.setBackgroundImage(null);canvas.setBackgroundColor(v,()=>{canvas.requestRenderAll();snap();renderPanel();});}
function setBgImage(url){fabric.Image.fromURL(url,img=>{coverBg(img);canvas.setBackgroundImage(img,()=>{canvas.requestRenderAll();snap();renderPanel();});});}
function coverBg(img){const s=Math.max(W/img.width,H/img.height);img.set({scaleX:s,scaleY:s,originX:'center',originY:'center',left:W/2,top:H/2,name:'خلفية'});}
function addText(o={}){
  const font=o.font||'Cairo';
  const t=new fabric.Textbox(o.text||'اكتب هنا',{left:W/2,top:o.top||H/2,originX:'center',originY:'center',width:o.width||W*.8,fontFamily:font,fontSize:o.size||Math.round(W/9),fill:o.fill||(bgIsDark()?'#ffffff':'#1b1d24'),textAlign:'center',direction:'rtl',fontWeight:o.bold?'700':'400',name:o.name||'نص',lineHeight:1.15,ph:!!o.ph||!o.text});
  if(o.shadow)t.set('shadow',new fabric.Shadow({color:'rgba(0,0,0,.45)',blur:18,offsetX:0,offsetY:8}));
  ensureFont(font).then(()=>{t.initDimensions();canvas.add(t);if(!o.silent){canvas.setActiveObject(t);canvas.requestRenderAll();setTimeout(focusTextIn,80);}else canvas.requestRenderAll();});
  return t;
}
function bgIsDark(){const b=canvas.backgroundImage;if(b)return true;const c=canvas.backgroundColor;let hex=typeof c==='string'?c:(c&&c.colorStops?c.colorStops[0].color:'#fff');try{const col=new fabric.Color(hex).getSource();return (col[0]*299+col[1]*587+col[2]*114)/1000<128;}catch(e){return false;}}
function addImageFile(file,asBg){
  const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{
    const max=2200;let w=im.width,h=im.height;const s=Math.min(1,max/Math.max(w,h));w=Math.round(w*s);h=Math.round(h*s);
    const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(im,0,0,w,h);
    const png=/png|webp|gif/.test(file.type);const url=c.toDataURL(png?'image/png':'image/jpeg',.92);
    if(asBg)setBgImage(url);else fabric.Image.fromURL(url,img=>{const sc=Math.min(W*.7/img.width,H*.7/img.height,1);img.set({scaleX:sc,scaleY:sc,left:W/2,top:H/2,originX:'center',originY:'center',name:'صورة',preset:'none',adj:{b:0,c:0,s:0,h:0,bl:0}});canvas.add(img);canvas.setActiveObject(img);canvas.requestRenderAll();});
  };im.src=r.result;};r.readAsDataURL(file);
}
$('#fileImg').onchange=e=>{[...e.target.files].forEach(f=>addImageFile(f,false));e.target.value='';};
$('#fileBg').onchange=e=>{if(e.target.files[0])addImageFile(e.target.files[0],true);e.target.value='';};
function addSticker(ch,font){const t=new fabric.Text(ch,{left:W/2,top:H/2,originX:'center',originY:'center',fontSize:Math.round(W/5),fontFamily:font||'Tajawal',fill:bgIsDark()?'#f6c453':'#1b1d24',name:'ملصق '+ch});ensureFont(font||'Tajawal').then(()=>{t.initDimensions();canvas.add(t);canvas.setActiveObject(t);canvas.requestRenderAll();});}
function addShape(k){const s=Math.round(W/3),col=bgIsDark()?'#ffffff':'#1e3a5f';let o;
  const base={left:W/2,top:H/2,originX:'center',originY:'center',fill:col};
  if(k==='rect')o=new fabric.Rect({...base,width:s,height:s*.7,name:'مستطيل'});
  else if(k==='round')o=new fabric.Rect({...base,width:s,height:s*.7,rx:40,ry:40,name:'مستطيل دائري'});
  else if(k==='circle')o=new fabric.Circle({...base,radius:s/2,name:'دائرة'});
  else if(k==='tri')o=new fabric.Triangle({...base,width:s,height:s,name:'مثلث'});
  else if(k==='line')o=new fabric.Rect({...base,width:W*.6,height:Math.max(6,W/120),name:'خط'});
  else if(k==='heart')o=new fabric.Path('M50 88 L12 50 A22 22 0 0 1 50 22 A22 22 0 0 1 88 50 Z',{...base,name:'قلب'}),o.scale(s/100);
  else if(k==='star'){const pts=[];for(let i=0;i<10;i++){const r=i%2?40:100,a=Math.PI/2+i*Math.PI/5;pts.push({x:Math.cos(a)*r,y:-Math.sin(a)*r});}o=new fabric.Polygon(pts,{...base,name:'نجمة'});o.scale(s/200);}
  else if(k==='frame')o=new fabric.Rect({...base,width:W*.9,height:H*.9,fill:'transparent',stroke:col,strokeWidth:Math.max(8,W/60),name:'إطار',strokeUniform:true});
  canvas.add(o);canvas.setActiveObject(o);canvas.requestRenderAll();}
function addTable(rows,cols){
  const dark=bgIsDark(),stroke=dark?'#ffffff':'#1b1d24',fill=dark?'rgba(0,0,0,.35)':'rgba(255,255,255,.85)';
  const tw=W*.86,cellW=tw/cols,cellH=Math.max(W/5.5,H*.85/rows/1.6),th=cellH*rows,x0=(W-tw)/2,y0=(H-th)/2,sw=Math.max(3,Math.round(W/220));
  const names=['١','٢','٣','٤','٥','٦','٧','٨','٩'];let first=null,n=0;
  for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){n++;
    const rect=new fabric.Rect({left:x0+c*cellW,top:y0+r*cellH,width:cellW,height:cellH,fill,stroke,strokeWidth:sw,strokeUniform:true,name:'إطار '+names[n-1],rx:0,ry:0});
    const t=new fabric.Textbox('القسم '+names[n-1],{left:x0+c*cellW+cellW/2,top:y0+r*cellH+cellH/2,originX:'center',originY:'center',width:cellW*.88,fontFamily:'Cairo',fontSize:Math.round(Math.min(cellW/7,cellH/3)),fill:dark?'#ffffff':'#1b1d24',textAlign:'center',direction:'rtl',name:'نص القسم '+names[n-1],lineHeight:1.15,ph:true});
    canvas.add(rect);canvas.add(t);if(!first)first=t;}
  ensureFont('Cairo').then(()=>{canvas.getObjects().forEach(o=>{if(isText(o))o.initDimensions();});canvas.setActiveObject(first);canvas.requestRenderAll();setTimeout(focusTextIn,80);});
}
function addOverlay(k){let o;const base={left:0,top:0,width:W,height:H,selectable:true,role:'overlay',hasControls:false,lockMovementX:true,lockMovementY:true};
  if(k==='dark')o=new fabric.Rect({...base,fill:'#000000',opacity:.35,name:'تعتيم'});
  else if(k==='light')o=new fabric.Rect({...base,fill:'#ffffff',opacity:.35,name:'تفتيح'});
  else if(k==='bottom')o=new fabric.Rect({...base,fill:new fabric.Gradient({type:'linear',gradientUnits:'pixels',coords:{x1:0,y1:0,x2:0,y2:H},colorStops:[{offset:.35,color:'rgba(0,0,0,0)'},{offset:1,color:'rgba(0,0,0,.85)'}]}),opacity:1,name:'تدرج سفلي'});
  else if(k==='top')o=new fabric.Rect({...base,fill:new fabric.Gradient({type:'linear',gradientUnits:'pixels',coords:{x1:0,y1:0,x2:0,y2:H},colorStops:[{offset:0,color:'rgba(0,0,0,.85)'},{offset:.65,color:'rgba(0,0,0,0)'}]}),opacity:1,name:'تدرج علوي'});
  else if(k==='vignette')o=new fabric.Rect({...base,fill:new fabric.Gradient({type:'radial',gradientUnits:'pixels',coords:{x1:W/2,y1:H/2,r1:Math.min(W,H)*.3,x2:W/2,y2:H/2,r2:Math.max(W,H)*.75},colorStops:[{offset:0,color:'rgba(0,0,0,0)'},{offset:1,color:'rgba(0,0,0,.8)'}]}),opacity:1,name:'فينيت'});
  else if(k==='color'){const g=GRADS[Math.floor(Math.random()*GRADS.length)];o=new fabric.Rect({...base,fill:gradient(g,'d'),opacity:.45,name:'طبقة لونية'});}
  canvas.add(o);canvas.setActiveObject(o);canvas.requestRenderAll();}

function applySize(id,keep){const s=SIZES.find(x=>x.id===id);if(!s)return;const ow=W,oh=H;W=s.w;H=s.h;sizeId=id;
  if(keep){const k=Math.min(W/ow,H/oh);canvas.getObjects().forEach(o=>{if(o.role==='overlay'){o.set({width:W,height:H});return;}o.set({left:o.left*W/ow,top:o.top*H/oh,scaleX:o.scaleX*k,scaleY:o.scaleY*k});if(isText(o)){}o.setCoords();});
    if(canvas.backgroundImage)coverBg(canvas.backgroundImage);
    const bc=canvas.backgroundColor;if(bc&&bc.colorStops)canvas.setBackgroundColor(gradient(bc.colorStops.map(c=>c.color),bc.coords.x2&&bc.coords.y2?'d':bc.coords.x2?'h':'v'));}
  fit();canvas.requestRenderAll();snap();}
function applyTemplate(t){restoring=true;canvas.clear();restoring=false;const s=SIZES.find(x=>x.id===t.size);W=s.w;H=s.h;sizeId=t.size;fit();
  canvas.setBackgroundColor(gradient(t.bg,'d'));
  t.items.forEach(it=>{if(it.t==='text')addText({text:it.s,font:it.f,size:Math.round(it.sz*W/1080),fill:it.c,top:H*it.y,width:W*(it.w||.9),bold:it.bold,shadow:it.sh,silent:true});});
  canvas.discardActiveObject();canvas.requestRenderAll();setTimeout(()=>{snap();renderPanel();},300);$('#projTitle').value=t.n;}
function newDesign(id){curId=null;dirty=false;restoring=true;canvas.clear();canvas.setBackgroundColor('#ffffff');restoring=false;hist=[];hi=-1;$('#projTitle').value='تصميم بدون عنوان';applySize(id,false);dirty=false;tab='tpl';renderTabs();renderPanel();}

/* image filters */
function rebuildFilters(img){const F=fabric.Image.filters,a=img.adj||{b:0,c:0,s:0,h:0,bl:0};const p=FILTERS.find(f=>f.id===(img.preset||'none'))||FILTERS[0];
  const fs=p.f();if(a.b)fs.push(new F.Brightness({brightness:a.b}));if(a.c)fs.push(new F.Contrast({contrast:a.c}));if(a.s)fs.push(new F.Saturation({saturation:a.s}));if(a.h)fs.push(new F.HueRotation({rotation:a.h}));if(a.bl)fs.push(new F.Blur({blur:a.bl}));
  img.filters=fs;img.applyFilters();canvas.requestRenderAll();}
function filterTarget(){const o=active();if(o&&o.type==='image')return o;return canvas.backgroundImage||null;}

/* =========================== export =========================== */
async function deliver(name,blob){
  try{if(window.claude&&claude.use){const d=await claude.use('downloads');if(d){await d.save({filename:name,data:blob});toast('تم الحفظ');return;}}}
  catch(e){if(e&&e.code==='declined')return;if(e&&e.code&&e.code!=='unavailable'){toast('تعذر الحفظ: '+e.code);return;}}
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},3000);
}
function dataURLtoBlob(u){const [h,b]=u.split(',');const m=h.match(/:(.*?);/)[1];const bin=atob(b);const arr=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)arr[i]=bin.charCodeAt(i);return new Blob([arr],{type:m});}
$('#exportBtn').onclick=()=>{$('#exportModal').hidden=false;updExportInfo();};
$('#closeExport').onclick=()=>$('#exportModal').hidden=true;
$('#fmtSeg').onclick=e=>{const b=e.target.closest('button');if(!b)return;fmt=b.dataset.f;$$('#fmtSeg button').forEach(x=>x.classList.toggle('active',x===b));updExportInfo();};
$('#qSeg').onclick=e=>{const b=e.target.closest('button');if(!b)return;qual=+b.dataset.q;$$('#qSeg button').forEach(x=>x.classList.toggle('active',x===b));updExportInfo();};
function updExportInfo(){$('#exportInfo').textContent=fmt==='pdf'?`PDF بمقاس ${(W/300*25.4).toFixed(0)}×${(H/300*25.4).toFixed(0)} ملم`:`صورة ${fmt.toUpperCase()} بأبعاد ${W*qual}×${H*qual} بكسل`;}
$('#doExport').onclick=async()=>{
  canvas.discardActiveObject();canvas.requestRenderAll();const name=($('#projTitle').value||'تصميم').replace(/[\\/:*?"<>|]/g,'-');
  const mult=Math.min(qual,Math.floor(16000/Math.max(W,H))||1)/scale;
  if(fmt==='pdf'){const url=canvas.toDataURL({format:'jpeg',quality:.95,multiplier:Math.min(2,mult)});const {jsPDF}=window.jspdf;const mmW=W/300*25.4,mmH=H/300*25.4;const doc=new jsPDF({orientation:mmW>mmH?'l':'p',unit:'mm',format:[mmW,mmH]});doc.addImage(url,'JPEG',0,0,mmW,mmH);await deliver(name+'.pdf',doc.output('blob'));}
  else{const url=canvas.toDataURL({format:fmt==='jpg'?'jpeg':'png',quality:.95,multiplier:mult});await deliver(name+'.'+fmt,dataURLtoBlob(url));}
  $('#exportModal').hidden=true;
};
$('#newBtn').onclick=()=>{$('#newModal').hidden=false;};
$('#closeNew').onclick=()=>$('#newModal').hidden=true;
$('#newSizes').innerHTML=SIZES.map(s=>sizeBtn(s)).join('');
$('#newSizes').onclick=e=>{const b=e.target.closest('button');if(!b)return;$('#newModal').hidden=true;newDesign(b.dataset.id);};
function sizeBtn(s){const r=s.w/s.h,bw=r>=1?30:30*r,bh=r>=1?30/r:30;return `<button data-id="${s.id}" class="${s.id===sizeId?'active':''}"><i class="box" style="width:${bw}px;height:${bh}px"></i>${s.n}<small>${s.w}×${s.h}</small></button>`;}
</script>
<script>
/* =========================== UI panels =========================== */
const I={
 tpl:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="8" height="8" rx="2"/><rect x="13" y="3" width="8" height="8" rx="2"/><rect x="3" y="13" width="8" height="8" rx="2"/><rect x="13" y="13" width="8" height="8" rx="2"/></svg>',
 text:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M5 6V4h14v2M12 4v16M9 20h6"/></svg>',
 img:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="m21 16-5-5-8 8"/></svg>',
 stk:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M9 10h.01M15 10h.01M8.5 14.5c1 1.2 2.2 1.8 3.5 1.8s2.5-.6 3.5-1.8"/></svg>',
 bg:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 4h16v16H4z"/><path d="M4 14l5-5 6 6 5-4"/></svg>',
 fx:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 12h3M11 12h9M4 17h12M20 17h0"/><circle cx="16" cy="7" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="18" cy="17" r="2"/></svg>',
 lay:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="m12 3 9 5-9 5-9-5 9-5z"/><path d="m3 13 9 5 9-5"/><path d="m3 17 9 5 9-5"/></svg>'
};
const TABS=[['tpl','قوالب'],['text','نص'],['img','صور'],['stk','ملصقات'],['bg','خلفية'],['fx','مؤثرات'],['lay','طبقات']];
function renderTabs(){$('#tabs').innerHTML=TABS.map(([k,n])=>`<button class="tab ${tab===k?'active':''}" data-t="${k}">${I[k]}<span>${n}</span></button>`).join('');}
$('#tabs').onclick=e=>{const b=e.target.closest('.tab');if(!b)return;$('#sheet').classList.remove('collapsed');tab=b.dataset.t;renderTabs();renderPanel();};
$('#grip').onclick=()=>$('#sheet').classList.toggle('collapsed');

const hex=c=>{try{return '#'+new fabric.Color(c||'#000').toHex().toLowerCase();}catch(e){return '#000000';}};
const swatches=(cur,attr,extra='')=>`<div class="grid g6">${extra}${PALETTE.map(c=>`<button class="sw ${cur&&hex(cur).toLowerCase()===c?'active':''}" style="background:${c}" data-${attr}="${c}"></button>`).join('')}<label class="sw custom"><input type="color" data-${attr}pick="1" value="${cur?hex(cur):'#000000'}"></label></div>`;
const slider=(id,label,min,max,step,val,unit='')=>`<div class="slider"><span>${label}</span><input type="range" id="${id}" min="${min}" max="${max}" step="${step}" value="${val}"><span>${typeof val==='number'?(Math.round(val*100)/100):val}${unit}</span></div>`;

function renderPanel(){
  const p=$('#panel'),o=active();let h='';
  if(tab==='tpl'){
    h+=`<div class="sec"><div class="sec-h">القوالب الجاهزة</div><div class="tpl">${TEMPLATES.map(t=>`<button data-tpl="${t.id}" style="background:linear-gradient(160deg,${t.bg.join(',')})">${t.n}<span>${SIZES.find(s=>s.id===t.size).n}</span></button>`).join('')}</div></div>`;

  }

    if(isText(o)){

      h+=`<div class="sec"><div class="row" style="flex-wrap:nowrap"><div class="seg" style="flex:1"><button data-al="right" class="${o.textAlign==='right'?'active':''}">يمين</button><button data-al="center" class="${o.textAlign==='center'?'active':''}">وسط</button><button data-al="left" class="${o.textAlign==='left'?'active':''}">يسار</button></div><button class="btn ${o.fontWeight==='700'||o.fontWeight==='bold'?'primary':''}" id="boldBtn" style="font-weight:900">B</button></div></div>`;
      h+=slider('fsz','الحجم',12,Math.round(W/2),1,Math.round(o.fontSize));
      h+=`<div class="sec"><div class="sec-h">اللون</div>${swatches(o.fill,'fill')}</div>`;
      h+=`<div class="sec"><div class="sec-h">الخط</div><div class="fontlist" id="fontList">${FONTS.map(([f,n])=>`<button data-font="${f}" class="${o.fontFamily===f?'active':''}" style="font-family:'${f}'">${n}<small>${f}</small></button>`).join('')}</div></div>`;
      h+=`<div class="sec"><div class="sec-h">تأثيرات النص</div><div class="chips"><button class="chip ${sh?'active':''}" data-eff="shadow">ظل</button><button class="chip ${sh&&sh.blur>20&&!sh.offsetY?'active':''}" data-eff="glow">توهج</button><button class="chip ${o.strokeWidth>0?'active':''}" data-eff="stroke">حدود</button><button class="chip ${o.textBackgroundColor?'active':''}" data-eff="hl">تظليل</button><button class="chip" data-eff="clear">مسح</button></div></div>`;

      h+=`<div class="sec"><div class="sec-h">تنسيق</div>${slider('lsp','تباعد الحروف',-200,800,10,o.charSpacing||0)}${slider('lh','تباعد الأسطر',.7,2.5,.05,o.lineHeight)}${slider('op','الشفافية',0,1,.05,o.opacity)}${slider('rot','الدوران',-180,180,1,Math.round(o.angle))}</div>`;
    }else{

      h+=`<div class="sec"><div class="sec-h">جدول بإطارات — كل قسم يُعبّأ على حدة</div><div class="chips"><button class="chip" data-table="3,1">٣ أقسام (صفوف)</button><button class="chip" data-table="1,3">٣ أقسام (أعمدة)</button><button class="chip" data-table="2,1">قسمان</button><button class="chip" data-table="4,1">٤ أقسام</button><button class="chip" data-table="3,2">٣×٢</button></div></div>`;
      h+=`<div class="sec"><div class="sec-h">أضف نصًا بخط معيّن</div><div class="fontlist">${FONTS.map(([f,n])=>`<button data-addfont="${f}" style="font-family:'${f}'">${n}<small>${f}</small></button>`).join('')}</div></div>`;
    }
  }
  else if(tab==='img'){
    h+=`<div class="sec"><div class="grid" style="grid-template-columns:1fr 1fr"><button class="btn primary" id="pickImg" style="justify-content:center">إدراج صورة من الاستديو</button><button class="btn" id="pickBg2" style="justify-content:center">صورة كخلفية</button></div></div>`;

function cssPreview(id){return {gray:'grayscale(1)',sepia:'sepia(1)',vintage:'sepia(.5) contrast(1.2) brightness(.9)',kodak:'saturate(1.6) contrast(1.1)',polaroid:'contrast(1.2) brightness(1.1) saturate(.8)',warm:'sepia(.3) saturate(1.3)',cool:'hue-rotate(30deg)',teal:'hue-rotate(60deg) saturate(.8)',invert:'invert(1)',pixel:'blur(1px)',noise:'contrast(1.4)'}[id]||'none';}
function layerName(x){if(isText(x))return (x.name&&x.name.startsWith('ملصق')?x.name:'نص: '+x.text.split('\n')[0].slice(0,18));return x.name||x.type;}
function focusTextIn(){const t=$('#txtIn'),o=active();if(t&&o&&isText(o)){t.focus();if(o.ph)t.select();}}
function syncTextarea(){const t=$('#txtIn'),o=active();if(t&&o&&isText(o)&&document.activeElement!==t)t.value=o.text;}

function bindPanel(){
  const p=$('#panel');
  p.onclick=e=>{
    const b=e.target.closest('button');
    if(!b){const L=e.target.closest('.layer');if(L&&L.dataset.i!==undefined){const objs=canvas.getObjects().slice().reverse(),x=objs[+L.dataset.i];if(x){canvas.setActiveObject(x);canvas.requestRenderAll();renderPanel();}}return;}
    const d=b.dataset,o=active();
    if(d.tpl){applyTemplate(TEMPLATES.find(t=>t.id===d.tpl));return;}
    if(b.closest('#sizeGrid')&&d.id){applySize(d.id,true);renderPanel();return;}
    if(d.add){addText(d.add==='h'?{text:'عنوان رئيسي',font:'Cairo',size:Math.round(W/8),bold:true,ph:true}:d.add==='s'?{text:'عنوان فرعي',font:'Tajawal',size:Math.round(W/14),ph:true}:{text:'اكتب نصك هنا',font:'Tajawal',size:Math.round(W/24),ph:true});return;}
    if(d.addfont){addText({text:'اكتب هنا',font:d.addfont});return;}
    if(d.table){const [r,c]=d.table.split(',').map(Number);addTable(r,c);return;}
    if(d.font&&isText(o)){o.set('fontFamily',d.font);ensureFont(d.font).then(()=>{o.initDimensions();o.setCoords();canvas.requestRenderAll();snap();});$$('#fontList button').forEach(x=>x.classList.toggle('active',x===b));return;}
    if(d.al&&isText(o)){o.set('textAlign',d.al);canvas.requestRenderAll();snap();renderPanel();return;}
    if(b.id==='boldBtn'&&isText(o)){o.set('fontWeight',(o.fontWeight==='700'||o.fontWeight==='bold')?'400':'700');ensureFont(o.fontFamily).then(()=>{o.initDimensions();canvas.requestRenderAll();snap();renderPanel();});return;}
    if(d.eff&&isText(o)){
      if(d.eff==='shadow')o.set('shadow',o.shadow&&o.shadow.offsetY?null:new fabric.Shadow({color:'rgba(0,0,0,.5)',blur:12,offsetX:0,offsetY:8}));
      if(d.eff==='glow')o.set('shadow',o.shadow&&!o.shadow.offsetY?null:new fabric.Shadow({color:'#ffffff',blur:40,offsetX:0,offsetY:0}));
      if(d.eff==='stroke')o.set(o.strokeWidth>0?{strokeWidth:0}:{stroke:bgIsDark()?'#000000':'#ffffff',strokeWidth:Math.max(2,Math.round(o.fontSize/25)),paintFirst:'stroke',strokeLineJoin:'round'});
      if(d.eff==='hl')o.set('textBackgroundColor',o.textBackgroundColor?'':'#f6c453');
      if(d.eff==='clear')o.set({shadow:null,strokeWidth:0,textBackgroundColor:''});
      canvas.requestRenderAll();snap();renderPanel();return;}
    if(d.fill&&o){o.set('fill',d.fill);canvas.requestRenderAll();snap();renderPanel();return;}
    if(d.stroke&&o){o.set('stroke',d.stroke);canvas.requestRenderAll();snap();renderPanel();return;}
    if(d.tbg&&o){o.set('textBackgroundColor',d.tbg);canvas.requestRenderAll();snap();renderPanel();return;}
    if(d.shc&&o&&o.shadow){o.shadow.color=d.shc;canvas.requestRenderAll();snap();renderPanel();return;}
    if(b.id==='pickImg'||b.id==='pickPng'){$('#fileImg').click();return;}
    if(b.id==='pickBg'||b.id==='pickBg2'){$('#fileBg').click();return;}
    if(b.id==='rmBg'){canvas.setBackgroundImage(null);canvas.requestRenderAll();snap();renderPanel();return;}
    if(d.preset&&o&&o.type==='image'){o.preset=d.preset;rebuildFilters(o);snap();renderPanel();return;}
    if(d.bgpreset&&canvas.backgroundImage){canvas.backgroundImage.preset=d.bgpreset;rebuildFilters(canvas.backgroundImage);snap();renderPanel();return;}
    if(d.fxpreset&&filterTarget()){const t=filterTarget();t.preset=d.fxpreset;rebuildFilters(t);snap();renderPanel();return;}
    if(d.clip&&o&&o.type==='image'){if(d.clip==='none')o.clipPath=null;else if(d.clip==='circle')o.clipPath=new fabric.Circle({radius:Math.min(o.width,o.height)/2,originX:'center',originY:'center'});else o.clipPath=new fabric.Rect({width:o.width,height:o.height,rx:Math.min(o.width,o.height)*.12,ry:Math.min(o.width,o.height)*.12,originX:'center',originY:'center'});o.dirty=true;canvas.requestRenderAll();snap();renderPanel();return;}
    if(d.flip&&o){o.set(d.flip==='x'?'flipX':'flipY',!(d.flip==='x'?o.flipX:o.flipY));canvas.requestRenderAll();snap();return;}
    if(d.cover&&o&&o.type==='image'){coverBg(o);o.set({name:'صورة',angle:0});canvas.sendToBack(o);o.setCoords();canvas.requestRenderAll();snap();return;}
    if(d.imgstroke&&o){if(d.imgstroke==='none')o.set({strokeWidth:0});else o.set({stroke:d.imgstroke,strokeWidth:o.strokeWidth||16,strokeUniform:true});canvas.requestRenderAll();snap();renderPanel();return;}
    if(d.shape){addShape(d.shape);return;}
    if(d.orn){addSticker(d.orn,'Amiri');return;}
    if(d.emo){addSticker(d.emo,'Tajawal');return;}
    if(d.bgc){setBgColor(d.bgc);return;}
    if(d.grad){const dir=($('#gdir .active')||{}).dataset?.dir||'v';canvas.setBackgroundImage(null);canvas.setBackgroundColor(gradient(GRADS[+d.grad],dir),()=>{canvas.requestRenderAll();snap();});$$('[data-grad]').forEach(x=>x.classList.toggle('active',x===b));return;}
    if(d.dir){$$('#gdir button').forEach(x=>x.classList.toggle('active',x===b));const bc=canvas.backgroundColor;if(bc&&bc.colorStops){canvas.setBackgroundColor(gradient(bc.colorStops.map(c=>c.color),d.dir),()=>{canvas.requestRenderAll();snap();});}return;}
    if(d.ov){addOverlay(d.ov);return;}
    if(d.selov){const ovs=canvas.getObjects().filter(x=>x.role==='overlay');canvas.setActiveObject(ovs[+d.selov]);canvas.requestRenderAll();return;}
    if(b.id==='rmOv'&&o){canvas.remove(o);canvas.discardActiveObject();canvas.requestRenderAll();snap();renderPanel();return;}
    const L=b.closest('.layer');if(L&&d.act){const objs=canvas.getObjects().slice().reverse(),x=objs[+L.dataset.i];if(!x)return;
      if(d.act==='up')canvas.bringForward(x);if(d.act==='down')canvas.sendBackwards(x);if(d.act==='vis'){x.visible=!x.visible;}if(d.act==='lock'){setLock(x,!x.locked);}if(d.act==='del'){canvas.remove(x);}
      canvas.requestRenderAll();snap();renderPanel();return;}
  };
  p.oninput=e=>{
    const t=e.target,o=active(),v=parseFloat(t.value);const lbl=t.parentElement&&t.parentElement.querySelector('span:last-child');if(lbl&&t.type==='range')lbl.textContent=Math.round(v*100)/100;
    if(t.id==='txtIn'&&isText(o)){o.ph=false;o.set('text',t.value);o.initDimensions();canvas.requestRenderAll();snapSoon();return;}
    if(t.dataset.fillpick&&o){o.set('fill',t.value);canvas.requestRenderAll();snapSoon();return;}
    if(t.dataset.strokepick&&o){o.set('stroke',t.value);canvas.requestRenderAll();snapSoon();return;}
    if(t.dataset.imgstrokepick&&o){o.set({stroke:t.value,strokeWidth:o.strokeWidth||16,strokeUniform:true});canvas.requestRenderAll();snapSoon();return;}
    if(t.dataset.tbgpick&&o){o.set('textBackgroundColor',t.value);canvas.requestRenderAll();snapSoon();return;}
    if(t.dataset.shcpick&&o&&o.shadow){o.shadow.color=t.value;canvas.requestRenderAll();snapSoon();return;}
    if(t.dataset.bgcpick){canvas.setBackgroundImage(null);canvas.setBackgroundColor(t.value,()=>canvas.requestRenderAll());snapSoon();return;}
    if(!o&&!/^(bg|fx)/.test(t.id))return;
    switch(t.id){
      case 'fsz':o.set('fontSize',v);o.initDimensions();break;
      case 'op':o.set('opacity',v);break;
      case 'rot':o.rotate(v);break;
      case 'lsp':o.set('charSpacing',v);o.initDimensions();break;
      case 'lh':o.set('lineHeight',v);o.initDimensions();break;
      case 'strw':o.set('strokeWidth',v);break;
      case 'imgstrw':o.set({strokeWidth:v,strokeUniform:true});if(v&&!o.stroke)o.set('stroke','#ffffff');break;
      case 'shb':if(o.shadow)o.shadow.blur=v;break;
      case 'sho':if(o.shadow)o.shadow.offsetY=v;break;
      case 'adjb':case 'adjc':case 'adjs':case 'adjh':case 'adjbl':{if(o.type!=='image')return;o.adj=o.adj||{b:0,c:0,s:0,h:0,bl:0};o.adj[t.id.slice(3)]=v;rebuildFilters(o);break;}
      case 'bgb':case 'bgc2':case 'bgs':case 'bgbl':{const bi=canvas.backgroundImage;if(!bi)return;bi.adj=bi.adj||{b:0,c:0,s:0,h:0,bl:0};bi.adj[{bgb:'b',bgc2:'c',bgs:'s',bgbl:'bl'}[t.id]]=v;rebuildFilters(bi);break;}
      case 'fxb':case 'fxc':case 'fxs':case 'fxbl':{const ft=filterTarget();if(!ft)return;ft.adj=ft.adj||{b:0,c:0,s:0,h:0,bl:0};ft.adj[t.id.slice(2)]=v;rebuildFilters(ft);break;}
      default:return;
    }
    if(o)o.setCoords();canvas.requestRenderAll();snapSoon();
  };
}

/* ===== projects (cloud with local fallback) ===== */
const store={
  uid(){try{return window.firebase&&firebase.auth().currentUser?firebase.auth().currentUser.uid:null;}catch(e){return null;}},
  cloud(){return !!(this.uid()&&window.firebase&&firebase.database);},
  ref(){return firebase.database().ref('projects/'+this.uid());},
  lkey:'midad.projects',
  lread(){try{return JSON.parse(localStorage.getItem(this.lkey))||{};}catch(e){return {};}},
  lwrite(o){try{localStorage.setItem(this.lkey,JSON.stringify(o));}catch(e){toast('مساحة التخزين المحلية ممتلئة');}},
  async list(){if(this.cloud()){const s=await this.ref().get();const v=s.val()||{};return Object.entries(v).map(([id,p])=>({id,title:p.title,W:p.W,H:p.H,thumb:p.thumb,updatedAt:p.updatedAt}));}
    return Object.entries(this.lread()).map(([id,p])=>({id,title:p.title,W:p.W,H:p.H,thumb:p.thumb,updatedAt:p.updatedAt}));},
  async get(id){if(this.cloud())return (await this.ref().child(id).get()).val();return this.lread()[id];},
  async put(id,data){if(this.cloud()){await this.ref().child(id).set(data);return;}const o=this.lread();o[id]=data;this.lwrite(o);},
  async del(id){if(this.cloud()){await this.ref().child(id).remove();return;}const o=this.lread();delete o[id];this.lwrite(o);},
  newId(){return (this.cloud()?this.ref().push().key:('p'+Date.now().toString(36)+Math.random().toString(36).slice(2,6)));}
};
function thumb(){canvas.discardActiveObject();const m=Math.min(1,320/Math.max(W,H))/scale;return canvas.toDataURL({format:'jpeg',quality:.6,multiplier:m});}
let saving=false;
async function saveProject(silent){
  if(saving)return;saving=true;
  try{if(!curId)curId=store.newId();const title=$('#projTitle').value.trim()||'تصميم بدون عنوان';
    await store.put(curId,{title,W,H,sizeId,json:hist[hi]||serialize(),thumb:thumb(),updatedAt:Date.now()});dirty=false;if(!silent)toast('تم الحفظ');}
  catch(e){toast('تعذر الحفظ: '+(e.message||e));}
  saving=false;
}
const cloudSaveSoon=debounce(()=>saveProject(true),4000);
async function openProject(id){
  const p=await store.get(id);if(!p)return toast('التصميم غير موجود');
  curId=id;W=p.W;H=p.H;sizeId=p.sizeId||sizeId;$('#projTitle').value=p.title||'';fit();
  restoring=true;canvas.loadFromJSON(p.json,()=>{restoring=false;refreshTexts();canvas.requestRenderAll();hist=[p.json];hi=0;dirty=false;updUndo();tab='tpl';renderTabs();renderPanel();});

async function renderProjects(){
  const g=$('#projGrid');g.innerHTML='<p class="empty">جارٍ التحميل…</p>';
  try{const list=(await store.list()).sort((a,b)=>(b.updatedAt||0)-(a.updatedAt||0));
    $('#projNote').textContent=store.cloud()?'تصاميمك محفوظة في حسابك وتفتحها من أي جهاز':'تصاميمك محفوظة على هذا الجهاز فقط';
    g.innerHTML=list.length?list.map(p=>`<div class="pj" data-id="${p.id}"><div class="th" style="background-image:url(${p.thumb||''})" data-open="1"></div><div class="nm">${(p.title||'بدون عنوان').replace(/</g,'&lt;')}</div><div class="dt">${p.W}×${p.H} · ${p.updatedAt?new Date(p.updatedAt).toLocaleDateString('ar-SA-u-nu-latn'):''}</div><div class="ac"><button data-open="1">فتح</button><button data-del="1" class="danger">حذف</button></div></div>`).join(''):'<p class="empty">لا توجد تصاميم محفوظة بعد — اضغط "حفظ" في المحرر لحفظ تصميمك</p>';}
  catch(e){g.innerHTML='<p class="empty">تعذر التحميل: '+(e.message||e)+'</p>';}
}
$('#homeBtn').onclick=()=>{$('#projModal').hidden=false;renderProjects();};
$('#closeProj').onclick=()=>$('#projModal').hidden=true;
$('#projNew').onclick=()=>{$('#projModal').hidden=true;$('#newModal').hidden=false;};
$('#saveBtn').onclick=()=>saveProject(false);
$('#projGrid').onclick=async e=>{const b=e.target.closest('[data-open],[data-del]');if(!b)return;const id=b.closest('.pj').dataset.id;
  if(b.dataset.open){if(dirty&&curId!==id&&!confirm('لديك تعديلات غير محفوظة في التصميم الحالي. هل تريد المتابعة؟'))return;openProject(id);}
  else if(b.dataset.del){if(!confirm('حذف هذا التصميم نهائيًا؟'))return;await store.del(id);if(curId===id){curId=null;}renderProjects();toast('تم الحذف');}};
$('#projTitle').addEventListener('change',()=>{if(curId)cloudSaveSoon();});
window.addEventListener('beforeunload',e=>{if(dirty&&!curId){e.preventDefault();e.returnValue='';}});
document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key==='s'){e.preventDefault();saveProject(false);}});
document.addEventListener('midad-auth',e=>{const d=e.detail;$('#adminBtn2').hidden=!(d&&d.admin);if(d){fit();}});
$('#adminBtn2').onclick=()=>location.href='admin.html';
$('#logoutBtn2').onclick=()=>{if(window.firebase)firebase.auth().signOut();$('#projModal').hidden=true;};
</script>

</body>
</html>
